<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Chat</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #f0f2f5; height: 100vh; display: flex; align-items: center; justify-content: center;
  }
  .app {
    width: 100%; max-width: 860px; height: 100vh; max-height: 780px;
    background: #fff; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,.08);
    display: flex; flex-direction: column; overflow: hidden;
  }
  /* Header */
  .header {
    padding: 16px 24px; border-bottom: 1px solid #e5e7eb;
    display: flex; align-items: center; justify-content: space-between;
  }
  .header h1 { font-size: 18px; font-weight: 600; color: #111; }
  .header-actions { display: flex; gap: 8px; align-items: center; }
  .btn {
    padding: 6px 14px; border-radius: 8px; border: 1px solid #d1d5db;
    background: #fff; color: #374151; font-size: 13px; cursor: pointer; transition: .15s;
  }
  .btn:hover { background: #f3f4f6; border-color: #9ca3af; }
  .btn-primary { background: #2563eb; border-color: #2563eb; color: #fff; }
  .btn-primary:hover { background: #1d4ed8; border-color: #1d4ed8; }
  .btn-danger { color: #ef4444; border-color: #fca5a5; }
  .btn-danger:hover { background: #fef2f2; border-color: #ef4444; }
  .btn-sm { padding: 4px 10px; font-size: 12px; }

  /* API Key Bar */
  .api-bar {
    padding: 10px 24px; background: #f9fafb; border-bottom: 1px solid #e5e7eb;
    display: flex; align-items: center; gap: 10px;
  }
  .api-bar label { font-size: 13px; color: #6b7280; white-space: nowrap; }
  .api-bar input[type="password"] {
    flex: 1; padding: 6px 10px; border: 1px solid #d1d5db; border-radius: 6px;
    font-size: 13px; outline: none;
  }
  .api-bar input[type="password"]:focus { border-color: #2563eb; box-shadow: 0 0 0 2px rgba(37,99,235,.15); }
  .api-status { font-size: 12px; padding: 2px 8px; border-radius: 10px; }
  .api-status.ok { background: #dcfce7; color: #16a34a; }
  .api-status.missing { background: #fef3c7; color: #d97706; }

  /* Messages */
  .messages {
    flex: 1; overflow-y: auto; padding: 20px 24px; display: flex; flex-direction: column; gap: 16px;
  }
  .msg { max-width: 80%; display: flex; flex-direction: column; gap: 4px; animation: fadeIn .25s; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  .msg.user { align-self: flex-end; }
  .msg.assistant { align-self: flex-start; }
  .msg-bubble {
    padding: 10px 16px; border-radius: 14px; font-size: 14px; line-height: 1.6; white-space: pre-wrap; word-break: break-word;
  }
  .msg.user .msg-bubble { background: #2563eb; color: #fff; border-bottom-right-radius: 4px; }
  .msg.assistant .msg-bubble { background: #f3f4f6; color: #1f2937; border-bottom-left-radius: 4px; }
  .msg-label { font-size: 11px; color: #9ca3af; padding: 0 4px; }

  /* Rating */
  .rating-area { margin-top: 6px; padding: 0 4px; }
  .rating-area .stars {
    display: flex; gap: 6px; flex-direction: row-reverse; justify-content: flex-end;
  }
  .rating-area .star-btn {
    background: none; border: none; font-size: 22px; cursor: pointer;
    color: #d1d5db; transition: .12s; line-height: 1; padding: 0;
  }
  .rating-area .star-btn:hover,
  .rating-area .star-btn.active { color: #f59e0b; }
  .rating-area .star-btn:hover ~ .star-btn { color: #f59e0b; }
  .rating-area .rating-value {
    font-size: 12px; color: #6b7280; margin-top: 2px;
  }

  /* Input Area */
  .input-area {
    padding: 16px 24px; border-top: 1px solid #e5e7eb; display: flex; gap: 10px; align-items: flex-end;
  }
  .input-area textarea {
    flex: 1; padding: 10px 14px; border: 1px solid #d1d5db; border-radius: 10px;
    font-size: 14px; resize: none; outline: none; font-family: inherit; line-height: 1.5;
    max-height: 120px; min-height: 44px;
  }
  .input-area textarea:focus { border-color: #2563eb; box-shadow: 0 0 0 2px rgba(37,99,235,.15); }
  .input-area .send-btn {
    width: 44px; height: 44px; border-radius: 50%; border: none; background: #2563eb;
    color: #fff; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: .15s; flex-shrink: 0;
  }
  .input-area .send-btn:hover { background: #1d4ed8; }
  .input-area .send-btn:disabled { background: #93c5fd; cursor: not-allowed; }

  /* Re-edit reference image bar */
  .ref-image-bar {
    display: none; padding: 8px 24px 0; align-items: center; gap: 10px;
  }
  .ref-image-bar.show { display: flex; }
  .ref-image-bar img {
    max-height: 56px; border-radius: 6px; border: 1px solid #d1d5db;
  }
  .ref-image-bar .ref-label {
    font-size: 13px; color: #6b7280;
  }
  .ref-image-bar .ref-close {
    cursor: pointer; color: #ef4444; font-size: 18px; line-height: 1; margin-left: auto;
  }
  .re-edit-btn {
    display: inline-block; margin-top: 4px; padding: 2px 10px;
    font-size: 12px; color: #2563eb; background: none; border: 1px solid #2563eb;
    border-radius: 4px; cursor: pointer; transition: .15s;
  }
  .re-edit-btn:hover { background: #eff6ff; }
  /* Image in messages */
  .msg-bubble img {
    max-width: 100%; max-height: 300px; border-radius: 8px; display: block; margin-top: 6px;
  }

  /* Scrollbar */
  .messages::-webkit-scrollbar { width: 6px; }
  .messages::-webkit-scrollbar-track { background: transparent; }
  .messages::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 3px; }

  /* Markdown-like styling inside assistant messages */
  .msg-bubble strong { font-weight: 600; }
  .msg-bubble code {
    background: rgba(0,0,0,.06); padding: 1px 5px; border-radius: 4px; font-size: 13px; font-family: "SFMono-Regular", Consolas, monospace;
  }
  .msg-bubble pre code { display: block; padding: 10px; overflow-x: auto; }
  .msg-bubble p { margin-bottom: 6px; }
  .msg-bubble p:last-child { margin-bottom: 0; }

  /* Export modal */
  .modal-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,.4);
    align-items: center; justify-content: center; z-index: 100;
  }
  .modal-overlay.show { display: flex; }
  .modal {
    background: #fff; border-radius: 14px; padding: 24px; width: 90%; max-width: 700px;
    max-height: 80vh; display: flex; flex-direction: column; box-shadow: 0 20px 60px rgba(0,0,0,.2);
  }
  .modal h2 { font-size: 16px; margin-bottom: 12px; }
  .modal textarea {
    flex: 1; min-height: 300px; border: 1px solid #d1d5db; border-radius: 8px;
    padding: 12px; font-size: 13px; font-family: "SFMono-Regular", Consolas, monospace;
    resize: vertical; outline: none;
  }
  .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px; }

  .typing-dots { display: inline-flex; gap: 3px; padding: 4px 0; }
  .typing-dots span {
    width: 7px; height: 7px; background: #9ca3af; border-radius: 50%;
    animation: bounce 1.2s infinite;
  }
  .typing-dots span:nth-child(2) { animation-delay: .2s; }
  .typing-dots span:nth-child(3) { animation-delay: .4s; }
  @keyframes bounce { 0%,60%,100% { transform: translateY(0); } 30% { transform: translateY(-6px); } }

  .empty-state {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: #9ca3af; font-size: 15px; gap: 8px;
  }
  .empty-state .icon { font-size: 48px; opacity: .5; }

  @media (max-width: 640px) {
    .app { max-height: 100vh; border-radius: 0; }
    .header { padding: 12px 16px; }
    .api-bar { flex-wrap: wrap; padding: 8px 16px; }
    .api-bar input { min-width: 120px; }
    .messages { padding: 12px 16px; }
    .input-area { padding: 12px 16px; }
    .msg { max-width: 92%; }
  }
</style>
</head>
<body>

<div class="app">
  <!-- Header -->
  <div class="header">
    <h1>AI Chat</h1>
    <div class="header-actions">
      <button class="btn btn-sm" onclick="exportHistory()">导出记录</button>
      <button class="btn btn-sm btn-danger" onclick="clearHistory()">清空</button>
    </div>
  </div>

  <!-- API Key -->
  <div class="api-bar">
    <label>API Key</label>
    <input type="password" id="apiKeyInput" placeholder="输入火山引擎方舟 API Key" oninput="saveApiKey()">
    <span class="api-status missing" id="apiStatus">未设置</span>
    <label style="margin-left:8px;">Model</label>
    <select id="modelSelect" style="padding:4px 8px;border:1px solid #d1d5db;border-radius:6px;font-size:13px;">
      <option value="doubao-seed-2-0-pro-260215">doubao-seed-2-0-pro-260215</option>
      <option value="doubao-pro-32k">doubao-pro-32k</option>
	      <option value="doubao-pro-128k">doubao-pro-128k</option>
      <option value="doubao-lite-32k">doubao-lite-32k</option>
	      <option value="doubao-seedream-5-0-260128">doubao-seedream-5-0-260128</option>
	    </select>
  </div>

  <!-- Messages -->
  <div class="messages" id="messages">
    <div class="empty-state" id="emptyState">
      <div class="icon">💬</div>
      <div>开始和 AI 对话吧</div>
      <div style="font-size:13px;">输入问题后按 Enter 发送</div>
    </div>
  </div>
  <!-- Reference image bar (for re-editing generated images) -->
  <div class="ref-image-bar" id="refImageBar">
    <img id="refPreview" src="">
    <span class="ref-label">编辑</span>
    <span class="ref-close" onclick="clearRefImage()">✕</span>
  </div>
  <!-- Input -->
  <div class="input-area">
    <textarea id="input" rows="1" placeholder="输入你的问题..." onkeydown="onInputKeydown(event)"></textarea>
    <button class="send-btn" id="sendBtn" onclick="sendMessage()" disabled>➤</button>
  </div>  </div>
<!-- Export Modal -->
<div class="modal-overlay" id="exportModal">
  <div class="modal">
    <h2>📋 对话导出</h2>
    <textarea id="exportContent" readonly></textarea>
    <div class="modal-actions">
      <button class="btn" onclick="closeExport()">关闭</button>
      <button class="btn btn-primary" onclick="copyExport()">复制</button>
      <button class="btn btn-primary" onclick="downloadExport()">下载</button>
    </div>
  </div>
</div>

<script>
// ===== State =====
const STORAGE_KEY = 'chat_history';
let history = loadHistory();
let currentAssistantMsgId = null;
let isSending = false;
let refImageUrl = null;

// ===== History Persistence =====
function loadHistory() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  } catch(e) {}
  return [];
}

function saveHistory() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
}

// ===== API Key =====
function saveApiKey() {
  const key = document.getElementById('apiKeyInput').value.trim();
  if (key) {
    localStorage.setItem('api_key', key);
    document.getElementById('apiStatus').textContent = '已设置';
    document.getElementById('apiStatus').className = 'api-status ok';
    document.getElementById('sendBtn').disabled = false;
  } else {
    localStorage.removeItem('api_key');
    document.getElementById('apiStatus').textContent = '未设置';
    document.getElementById('apiStatus').className = 'api-status missing';
    document.getElementById('sendBtn').disabled = true;
  }
}

function loadApiKey() {
  const key = localStorage.getItem('api_key') || '';
  document.getElementById('apiKeyInput').value = key;
  if (key) {
    document.getElementById('apiStatus').textContent = '已设置';
    document.getElementById('apiStatus').className = 'api-status ok';
    document.getElementById('sendBtn').disabled = false;
  }
}

// ===== Render =====
function renderMessages() {
  const container = document.getElementById('messages');
  container.innerHTML = '';

  if (history.length === 0) {
    container.innerHTML = `<div class="empty-state" id="emptyState">
      <div class="icon">💬</div>
      <div>开始和 AI 对话吧</div>
      <div style="font-size:13px;">输入问题后按 Enter 发送</div>
    </div>`;
    return;
  }

  history.forEach((msg, idx) => {
    const div = document.createElement('div');
    div.className = `msg ${msg.role}`;
    div.dataset.index = idx;

    const label = document.createElement('div');
    label.className = 'msg-label';
    label.textContent = msg.role === 'user' ? '你' : 'AI';
    div.appendChild(label);

	    const bubble = document.createElement('div');
	    bubble.className = 'msg-bubble';
	    if (msg.imageUrl) {
	      var img = document.createElement('img');
	      img.src = msg.imageUrl;
	      img.alt = '生成的图片';
	      bubble.appendChild(img);
	      var reBtn = document.createElement('button');
	      reBtn.className = 're-edit-btn';
	      reBtn.textContent = '编辑';
	      reBtn.onclick = function() { setRefImage(msg.imageUrl); };
	      bubble.appendChild(reBtn);
	    }
	    if (msg.content) {
	      var txt = document.createTextNode(msg.content);
	      bubble.appendChild(txt);
	    }
	    div.appendChild(bubble);
    if (msg.role === 'assistant') {
      const ratingArea = document.createElement('div');
      ratingArea.className = 'rating-area';
      ratingArea.innerHTML = renderStars(msg.rating || 0, idx);
      div.appendChild(ratingArea);
    }

    container.appendChild(div);
  });

  container.scrollTop = container.scrollHeight;
}

function renderStars(rating, idx) {
  let html = '<div class="stars">';
  for (let v = 10; v >= 1; v--) {
    const active = v <= rating ? 'active' : '';
    html += `<button class="star-btn ${active}" data-msgidx="${idx}" data-value="${v}">★</button>`;
  }
  html += '</div>';
  const label = rating > 0
    ? `<div class="rating-value">${rating}/7</div>`
    : '<div class="rating-value">点击星星评分（1：很不满意，10：很满意）</div>';
  return html + label;
}

// ===== Send Message =====
async function sendMessage() {
  const input = document.getElementById('input');
  const text = input.value.trim();
  if (!text || isSending) return;

  const apiKey = localStorage.getItem('api_key');
  if (!apiKey) { alert('请先设置 API Key'); return; }

  isSending = true;
  document.getElementById('sendBtn').disabled = true;
  input.value = '';

  const model = document.getElementById('modelSelect').value;
  const isImageGen = (model === 'doubao-seedream-5-0-260128');

  history.push({ role: 'user', content: text, rating: 0 });
  saveHistory();
  renderMessages();
  showTyping();

  try {
    if (isImageGen) {
	      var body = {
	        model: model,
	        prompt: text,
	        size: '2K',
	        response_format: 'url',
	        extra_body: { watermark: true }
	      };
	      if (refImageUrl) {
	        // Download reference image and convert to base64, then upload to API
	        try {
	          var imgResp = await fetch(refImageUrl);
	          var imgBlob = await imgResp.blob();
	          var base64 = await new Promise(function(resolve) {
	            var r = new FileReader();
	            r.onload = function() { resolve(r.result); };
	            r.readAsDataURL(imgBlob);
	          });
	          body.image = base64;
	        } catch(e) {
	          console.warn('Failed to fetch reference image, sending URL instead:', e);
	          body.image = refImageUrl;
	        }
	        clearRefImage();
	      }
	      const res = await fetch('https://ark.cn-beijing.volces.com/api/v3/images/generations', {
	        method: 'POST',
	        headers: {
	          'Content-Type': 'application/json',
	          'Authorization': 'Bearer ' + apiKey
	        },
	        body: JSON.stringify(body)
	      });
	      removeTyping();
	      if (!res.ok) {
	        const err = await res.text();
	        throw new Error('API Error ' + res.status + ': ' + err);
	      }
	      const data = await res.json();
	      console.log('Image gen response:', data);
	      const imageUrl = data.data && data.data[0] && data.data[0].url;
	      if (!imageUrl) throw new Error('无法获取图片URL: ' + JSON.stringify(data).slice(0, 300));
	      history.push({ role: 'assistant', content: '', imageUrl: imageUrl, rating: 0 });
	      saveHistory();
	      renderMessages();
    } else {
      const body = {
        model: model,
        input: history
          .filter(function(m) { return m.role === 'user' || m.role === 'assistant'; })
          .map(function(m) {
            return { role: m.role, content: [{ type: 'input_text', text: m.content || '' }] };
          })
      };
      const res = await fetch('https://ark.cn-beijing.volces.com/api/v3/responses', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + apiKey
        },
        body: JSON.stringify(body)
      });
      removeTyping();
      if (!res.ok) {
        const err = await res.text();
        throw new Error('API Error ' + res.status + ': ' + err);
      }
      const data = await res.json();
      console.log('API response:', data);
      var reply = null;
      if (data.output) {
        var msgObj = data.output.find(function(o) { return o.type === 'message'; });
        if (msgObj && msgObj.content && msgObj.content[0]) {
          reply = msgObj.content[0].text;
        }
      }
      if (!reply && data.choices && data.choices[0] && data.choices[0].message) {
        reply = data.choices[0].message.content;
      }
      if (!reply) {
        throw new Error('无法解析响应: ' + JSON.stringify(data).slice(0, 500));
      }
      history.push({ role: 'assistant', content: reply, rating: 0 });
      saveHistory();
      renderMessages();
    }
  } catch (err) {
    removeTyping();
    history.push({ role: 'assistant', content: '⚠️ 请求失败: ' + err.message, rating: 0 });
    saveHistory();
    renderMessages();
  }
  isSending = false;
  document.getElementById('sendBtn').disabled = false;
  input.focus();
}

function showTyping() {
  const container = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = 'msg assistant';
  div.id = 'typingIndicator';
  const label = document.createElement('div');
  label.className = 'msg-label';
  label.textContent = 'AI';
  div.appendChild(label);
  const bubble = document.createElement('div');
  bubble.className = 'msg-bubble';
  bubble.innerHTML = '<div class="typing-dots"><span></span><span></span><span></span></div>';
  div.appendChild(bubble);
  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
}

function removeTyping() {
  const el = document.getElementById('typingIndicator');
  if (el) el.remove();
}

// ===== Rating =====
document.addEventListener('click', function(e) {
  const btn = e.target.closest('.star-btn');
  if (!btn) return;

  const idx = parseInt(btn.dataset.msgidx);
  const value = parseInt(btn.dataset.value);

  if (history[idx] && history[idx].role === 'assistant') {
    history[idx].rating = value;
    saveHistory();

    // Update stars visually
    const stars = btn.closest('.stars');
    stars.querySelectorAll('.star-btn').forEach(sb => {
      sb.classList.toggle('active', parseInt(sb.dataset.value) <= value);
    });
    const valEl = stars.parentElement.querySelector('.rating-value');
    if (valEl) valEl.textContent = `${value}/10`;
  }
});

// ===== Input =====
function onInputKeydown(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
  // Auto-resize
  const el = e.target;
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}
// ===== Re-edit Image =====
function setRefImage(url) {
  refImageUrl = url;
  document.getElementById('refPreview').src = url;
  document.getElementById('refImageBar').classList.add('show');
}

function clearRefImage() {
  refImageUrl = null;
  document.getElementById('refPreview').src = '';
  document.getElementById('refImageBar').classList.remove('show');
}
// ===== Export =====
function exportHistory() {
  if (history.length === 0) { alert('没有对话记录可导出'); return; }

  let text = '';
  let msgCount = 0;
  history.forEach(msg => {
    if (msg.role === 'user') {
      msgCount++;
      text += `--- 对话 #${msgCount} ---\n`;
      text += `[用户]: ${msg.content}\n\n`;
    } else if (msg.role === 'assistant') {
      text += `[AI]: ${msg.content}\n`;
      if (msg.imageUrl) {
        text += `[生成的图片]: ${msg.imageUrl}\n`;
      }
      const rating = msg.rating || 0;
      const stars = rating > 0 ? '★'.repeat(rating) + '☆'.repeat(10 - rating) : '未评分';
      text += `[满意度: ${rating}/10] ${stars}\n\n`;
    }
  });

  document.getElementById('exportContent').value = text;
  document.getElementById('exportModal').classList.add('show');
}

function closeExport() {
  document.getElementById('exportModal').classList.remove('show');
}

function copyExport() {
  const ta = document.getElementById('exportContent');
  ta.select();
  document.execCommand('copy');
  alert('已复制到剪贴板');
}

function downloadExport() {
  const ta = document.getElementById('exportContent');
  const blob = new Blob([ta.value], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `chat-export-${new Date().toISOString().slice(0,10)}.txt`;
  a.click();
  URL.revokeObjectURL(url);
}

// ===== Clear =====
function clearHistory() {
  if (history.length === 0) return;
  if (!confirm('确定要清空所有对话记录吗？')) return;
  history = [];
  saveHistory();
  renderMessages();
}

// ===== Modal backdrop click =====
document.getElementById('exportModal').addEventListener('click', function(e) {
  if (e.target === this) closeExport();
});

// ===== Init =====
loadApiKey();
renderMessages();
</script>
</body>
</html>
